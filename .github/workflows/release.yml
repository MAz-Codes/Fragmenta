# Builds the macOS, Windows and Linux downloads, installs each on a fresh GitHub
# machine and runs its --self-test (installs the packages, starts the backend;
# no window, no model). Dev-only like the rest of the build tooling: it exists on
# dev/2.0, so only tags on dev/2.0 commits run it.
#
#   build-v<VERSION>  e.g. build-v2.0.0-rc.1: also a draft release v<VERSION>
#   build-dry-<name>  the files only, attached to this run; no release
#
# Unsigned (D22). Operator manual: packaging/README.md.
name: release

on:
  push:
    tags: ["build-v*", "build-dry-*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches VERSION
        if: startsWith(github.ref_name, 'build-v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME#build-v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME, VERSION $version"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15" # the uv the locks were made with
      - name: Locks match requirements.txt
        run: python packaging/lock.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Committed frontend build matches its source
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git status --porcelain -- build
          [ -z "$(git status --porcelain -- build)" ]

  build-macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash packaging/macos/build_dmg.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: packaging/build/Fragmenta-*-macOS-arm64.dmg
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: packaging\windows\build_exe.ps1
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: packaging/build/Fragmenta-*-Windows-x64-Setup.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            packaging/build/Fragmenta-*-Linux-x86_64.AppImage
            packaging/build/Fragmenta-*-Linux-x86_64.tar.gz
          if-no-files-found: error

  # Each test starts from a machine that has only the download: no checkout.
  test-macos:
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
      - name: Install from the .dmg
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/fragmenta-dmg Fragmenta-*-macOS-arm64.dmg
          mkdir -p "$HOME/Applications"
          ditto /tmp/fragmenta-dmg/Fragmenta.app "$HOME/Applications/Fragmenta.app"
          hdiutil detach /tmp/fragmenta-dmg
      - name: Self-test
        run: |
          df -h "$HOME"
          "$HOME/Applications/Fragmenta.app/Contents/MacOS/fragmenta" --self-test
      - name: App still sealed (nothing was written into it)
        run: codesign --verify --strict --deep -v "$HOME/Applications/Fragmenta.app"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-macos
          path: ~/Library/Application Support/FragmentaDesktop/logs/

  test-windows:
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
      - name: Install silently
        shell: pwsh
        run: |
          $setup = (Get-ChildItem Fragmenta-*-Windows-x64-Setup.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
      - name: Self-test
        shell: pwsh
        run: |
          Get-PSDrive C
          # A windowed exe prints nothing; logs/self-test.json has the checks.
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Fragmenta\fragmenta.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\FragmentaDesktop\logs\self-test.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test exit $($p.ExitCode)" }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows
          path: ~/AppData/Local/FragmentaDesktop/logs/

  test-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
      - name: Self-test
        run: |
          # The CUDA venv and its download cache need more room than / has.
          sudo mkdir -p /mnt/fragmenta && sudo chown "$USER" /mnt/fragmenta
          df -h / /mnt
          chmod +x Fragmenta-*-Linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 XDG_DATA_HOME=/mnt/fragmenta ./Fragmenta-*-Linux-x86_64.AppImage --self-test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-linux
          path: /mnt/fragmenta/FragmentaDesktop/logs/

  publish:
    if: startsWith(github.ref_name, 'build-v')
    needs: [test-macos, test-windows, test-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{macos,windows,linux}"
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cd dist
          sha256sum Fragmenta-* > SHA256SUMS
          cat SHA256SUMS
          # Like 1.3's: no "requires", so source installs are told git pull + launcher.
          python3 ../packaging/make_manifest.py -o latest.json \
            --artifact macos-arm64=Fragmenta-$version-macOS-arm64.dmg \
            --artifact windows-x64=Fragmenta-$version-Windows-x64-Setup.exe \
            --artifact linux-x86_64-appimage=Fragmenta-$version-Linux-x86_64.AppImage \
            --artifact linux-x86_64-tar=Fragmenta-$version-Linux-x86_64.tar.gz
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$version" --draft $prerelease --target "$GITHUB_SHA" \
            --title "Fragmenta $version" \
            --notes "Built by CI from $GITHUB_SHA. Write the notes before publishing." \
            Fragmenta-* SHA256SUMS latest.json
