# python-rtmidi 1.5.8 has no wheels for Python 3.14 (upstream PR #229 is still
# open), so we build them from the PyPI sdist with upstream's own cibuildwheel
# recipe (pyproject: manylinux_2_28, bundled JACK, libasound left to the
# system). Dev-only, like the rest of the build tooling: runs when this file
# changes on dev/2.0. The wheels land as an artifact; publishing them is a
# separate, manual step.
name: deps · python-rtmidi cp314

on:
  push:
    branches: [dev/2.0]
    paths: [.github/workflows/deps-rtmidi.yml]
  workflow_dispatch:

env:
  RTMIDI_VERSION: 1.5.8
  RTMIDI_SHA256: 7f9ade68b068ae09000ecb562ae9521da3a234361ad5449e83fc734544d004fa

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - name: Fetch the sdist
        shell: bash
        run: |
          curl -sSL -o rtmidi.tar.gz "https://files.pythonhosted.org/packages/source/p/python_rtmidi/python_rtmidi-${RTMIDI_VERSION}.tar.gz"
          echo "${RTMIDI_SHA256}  rtmidi.tar.gz" | shasum -a 256 -c -
          tar xzf rtmidi.tar.gz

      - uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: python_rtmidi-${{ env.RTMIDI_VERSION }}
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp314-manylinux_x86_64 cp314-win_amd64 cp314-macosx_arm64
          CIBW_ARCHS_MACOS: arm64

      - name: Checksums
        shell: bash
        run: cd wheelhouse && shasum -a 256 *.whl | tee "SHA256SUMS-${{ matrix.os }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-rtmidi-${{ env.RTMIDI_VERSION }}-cp314-${{ matrix.os }}
          path: wheelhouse/
