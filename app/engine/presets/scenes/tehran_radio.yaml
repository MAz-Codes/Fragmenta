# The perpetual radio: the installation's scenes, played by Tehran's clock.
# Start it with:  python -m app.engine --scene tehran_radio --sink radio --clock --play \
#                   --radio icecast://source:PASSWORD@relay.example.org:8000/tehran.mp3
# The engine resumes the right scene after any restart because the scene is a
# function of the time of day, not of a sequence position.
include: places
clock:
  enabled: true
  timezone: Asia/Tehran
  program:
    - {at: "05:00", scene: park_morning}
    - {at: "08:00", scene: street_midday}
    - {at: "10:00", scene: bazaar_midday}
    - {at: "13:00", scene: intersection}
    - {at: "15:00", scene: shop}
    - {at: "17:00", scene: bazaar_evening}
    - {at: "19:30", scene: cafe_evening}
    - {at: "22:00", scene: metro}
    - {at: "00:00", scene: night_metro}
    - {at: "01:30", scene: night_street}
sequence: [park_morning, street_midday, bazaar_midday, intersection, shop, bazaar_evening, cafe_evening, metro, night_metro, night_street]
