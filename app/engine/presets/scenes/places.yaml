# Scenes (places) for "Places I Have Always Never Been". A scene = blend + parameters +
# modulators + event types (each type is a `Sources` word rendered as a close event) +
# soundmarks. Event words are only ones the dataset carries (Iran_Lora/vocabulary.yaml):
# vendors, voices, motorcycles, music, birds, azan, horns, footsteps, announcements, wind,
# machinery, children. Scenes are sequenced by a program (the Scenes list in the tab).
scenes:
  - id: bazaar_midday
    label: Bazaar, midday
    blend: {bazaar: 1.0}
    params: {/events/density: 0.6, /events/sparseness: 0.2, /events/max_concurrent: 3}
    modulators:
      /events/density: {type: walk, rate: 0.05, depth: 0.15, seed: 17}
    events:
      vendors: {probability: 0.4, duration: [3, 8]}
      voices: {probability: 0.3, duration: [2, 6]}
      footsteps: {probability: 0.15, trajectory: passby}
      music: {probability: 0.15, distance: [4, 10], duration: [6, 10]}
    soundmarks:
      - {id: azan, fields: {sources: [azan], perspective: far, setting: exterior}, duration_s: 12}
  - id: bazaar_evening
    label: Bazaar, evening
    blend: {bazaar: 0.8, late_night: 0.2}
    params: {/events/density: 0.45, /events/sparseness: 0.3}
    events:
      vendors: {probability: 0.3, duration: [3, 8]}
      voices: {probability: 0.4, duration: [2, 6]}
      footsteps: {probability: 0.15, trajectory: passby}
      music: {probability: 0.15, distance: [4, 10], duration: [6, 10]}
  - id: street_midday
    label: Street, midday
    blend: {street: 1.0}
    params: {/events/density: 0.5, /events/sparseness: 0.25, /spatial/events/distance_max: 12}
    events:
      motorcycles: {probability: 0.4, trajectory: passby, duration: [3, 8]}
      horns: {probability: 0.25, distance: [4, 15], duration: [1.5, 4]}
      vendors: {probability: 0.2, duration: [3, 8]}
      voices: {probability: 0.15, duration: [2, 6]}
  - id: intersection
    label: Intersection
    blend: {intersection: 0.8, street: 0.2}
    params: {/events/density: 0.7, /events/sparseness: 0.1, /events/max_concurrent: 4}
    events:
      horns: {probability: 0.45, distance: [3, 15], duration: [1.5, 4]}
      motorcycles: {probability: 0.4, trajectory: passby, duration: [3, 8]}
      voices: {probability: 0.15, duration: [2, 6]}
  - id: shop
    label: Inside a shop
    blend: {shop: 0.7, street: 0.3}
    params: {/events/density: 0.3, /events/sparseness: 0.5, /spatial/events/distance_max: 4}
    events:
      voices: {probability: 0.6, duration: [2, 6]}
      vendors: {probability: 0.4, duration: [3, 8]}
  - id: cafe_evening
    label: Cafe, evening
    blend: {cafe: 0.9, street: 0.1}
    params: {/events/density: 0.35, /events/sparseness: 0.4}
    events:
      voices: {probability: 0.7, duration: [2, 6]}
      music: {probability: 0.3, distance: [3, 8], duration: [6, 10]}
  - id: park_morning
    label: Park, morning
    blend: {park: 1.0}
    params: {/events/density: 0.3, /events/sparseness: 0.5, /spatial/events/distance_max: 20}
    modulators:
      /events/density: {type: lfo, rate: 0.004, depth: 0.15}
    events:
      birds: {probability: 0.6, distance: [3, 20], duration: [2, 8]}
      children: {probability: 0.2, distance: [6, 20], duration: [3, 8]}
      voices: {probability: 0.2, distance: [5, 20], duration: [2, 6]}
  - id: metro
    label: Metro
    blend: {metro: 1.0}
    params: {/events/density: 0.5, /events/sparseness: 0.3}
    events:
      announcements: {probability: 0.3, duration: [4, 8]}
      footsteps: {probability: 0.3, trajectory: passby}
      voices: {probability: 0.3, duration: [2, 6]}
      machinery: {probability: 0.1, trajectory: passby, distance: [2, 10], duration: [4, 8]}
  - id: night_metro
    label: Metro, late night
    blend: {metro: 0.5, late_night: 0.5}
    params: {/events/density: 0.2, /events/sparseness: 0.6, /events/max_concurrent: 2}
    events:
      footsteps: {probability: 0.5, trajectory: passby}
      announcements: {probability: 0.3, duration: [4, 8]}
      machinery: {probability: 0.2, trajectory: passby, distance: [3, 12], duration: [4, 8]}
  - id: night_street
    label: Street, late night
    blend: {late_night: 0.8, street: 0.2}
    params: {/events/density: 0.15, /events/sparseness: 0.7, /spatial/events/distance_max: 25}
    events:
      motorcycles: {probability: 0.5, trajectory: passby, distance: [6, 25], duration: [3, 8]}
      voices: {probability: 0.25, distance: [8, 25], duration: [2, 6]}
      wind: {probability: 0.25, distance: [2, 6], duration: [4, 8]}
sequence: [bazaar_midday, street_midday, intersection, shop, cafe_evening, bazaar_evening, metro, night_metro, night_street, park_morning]
