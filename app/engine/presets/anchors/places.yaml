# Anchors for "Places I Have Always Never Been" — the fixed template
# (perpetual/decisions/03). Each anchor is a centroid of its base fields and
# its variants. Values must be lowercase ASCII and come from the vocabulary
# the LoRA was trained with; add a value only when the dataset has it.
anchors:
  - id: bazaar
    label: Bazaar
    color: "#E0B56F"
    fields: {type: ambience, place: bazaar, perspective: mid, density: dense, time: midday, setting: interior, sources: [vendors, voices, footsteps]}
    variants:
      - {sources: [vendors, voices]}
      - {sources: [voices, footsteps, music]}
      - {density: moderate}
      - {time: evening}
      - {perspective: far}
      - {sources: [vendors, voices, machinery]}
  - id: street
    label: Street
    color: "#A0B2D5"
    fields: {type: ambience, place: street, perspective: mid, density: moderate, time: midday, setting: exterior, sources: [traffic, motorcycles, voices]}
    variants:
      - {sources: [traffic, voices]}
      - {sources: [motorcycles, footsteps]}
      - {density: dense}
      - {time: evening}
      - {perspective: far, sources: [traffic]}
  - id: intersection
    label: Intersection
    color: "#C18992"
    fields: {type: ambience, place: intersection, perspective: mid, density: dense, time: midday, setting: exterior, sources: [traffic, horns, motorcycles]}
    variants:
      - {sources: [traffic, horns]}
      - {sources: [traffic, motorcycles, voices]}
      - {perspective: far}
      - {time: evening}
  - id: shop
    label: Shop
    color: "#92BBA3"
    fields: {type: ambience, place: shop, perspective: close, density: sparse, time: midday, setting: interior, sources: [voices, machinery]}
    variants:
      - {sources: [voices]}
      - {sources: [voices, doors]}
      - {density: moderate}
      - {perspective: mid}
  - id: cafe
    label: Cafe
    color: "#F6DBCF"
    fields: {type: ambience, place: cafe, perspective: mid, density: moderate, time: evening, setting: interior, sources: [voices, music]}
    variants:
      - {sources: [voices]}
      - {sources: [voices, music, machinery]}
      - {density: sparse}
      - {time: midday}
  - id: park
    label: Park
    color: "#CDDACB"
    fields: {type: ambience, place: park, perspective: far, density: sparse, time: morning, setting: exterior, sources: [birds, voices, water]}
    variants:
      - {sources: [birds, water]}
      - {sources: [birds, voices, footsteps]}
      - {time: evening}
      - {density: moderate}
  - id: metro
    label: Metro
    color: "#D5D5E4"
    fields: {type: ambience, place: metro, perspective: mid, density: dense, time: evening, setting: interior, sources: [machinery, voices, footsteps]}
    variants:
      - {sources: [machinery, footsteps]}
      - {sources: [machinery, voices]}
      - {density: moderate}
      - {time: night, density: sparse}
  - id: late_night
    label: Late night
    color: "#3D6FA8"
    fields: {type: ambience, perspective: far, density: sparse, time: night, setting: exterior, sources: [traffic, wind]}
    variants:
      - {sources: [traffic]}
      - {sources: [wind]}
      - {sources: [traffic, footsteps]}
      - {setting: interior, sources: [machinery]}
