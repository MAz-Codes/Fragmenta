# "Places I Have Always Never Been", first version (perpetual/decisions/11):
# about one hour through four places, then from the top. Edit in the Engine tab
# or here; a copy lives in <data>/engine/programs/ once the engine has run.
id: tehran_hour
label: Tehran, one hour
scenes: places
loop: true
steps:
  - {scene: street_midday, minutes: 10, transition_s: 25, from_azimuth: -60, beds: both, label: Street}
  - {scene: bazaar_midday, minutes: 10, transition_s: 30, from_azimuth: 90, beds: both, label: Bazaar}
  - {scene: street_midday, minutes: 8, transition_s: 25, from_azimuth: -120, beds: both, label: Street again}
  - {scene: metro, minutes: 10, transition_s: 30, from_azimuth: 180, beds: both, label: Metro}
  - {scene: street_midday, minutes: 8, transition_s: 25, from_azimuth: 60, beds: both, label: Street, later}
  - {scene: park_morning, minutes: 12, transition_s: 30, from_azimuth: -30, beds: both, label: Park and nature}
notes: Four places the dataset can hold up. Cafe, shop, intersection and mosque wait for more material.
