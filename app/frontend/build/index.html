<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Fragmenta — Stable Audio Fine-Tuning Application"
    />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Layout floor, in CSS px (after the fit-to-window zoom below):
         below it, scrollbars appear rather than the layout collapsing. */
      html, body {
        min-width: 1300px;
        min-height: 830px;
      }
      /* Type scale: every font size in the app is in rem, so this one value
         sets how large all text reads (18px root instead of 16px) while
         spacing and control heights, in px, stay put. */
      html { font-size: 112.5%; }

      /* Local variable fonts — ship with the app, no network dependency. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter Tight';
        src: url('/InterTight-VariableFont_wght.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Bitcount Single';
        src: url('/BitcountSingle-VariableFont_CRSV,ELSH,ELXP,slnt,wght.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
    </style>

    <script>
      // Fit to window: the UI is laid out for a 1650x960 viewport and the
      // whole page is zoomed so that fits any window, smaller or larger
      // (0.6x-1.25x). Text, controls and layout scale together, so every
      // screen shows the same composition instead of a cropped or sparse one.
      (function () {
        var W = 1650, H = 960;
        function fit() {
          var z = Math.min(window.innerWidth / W, window.innerHeight / H);
          z = Math.max(0.6, Math.min(1.25, z));
          document.documentElement.style.zoom = String(Math.round(z * 1000) / 1000);
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
    <title>Fragmenta</title>
    <script type="module" crossorigin src="/assets/index-K2Ax4ofJ.js"></script>
  </head>

    <div id="root"></div>
  </body>
</html>
